<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title description">
  <title id="title">BlueSentinel event investigation flow</title>
  <desc id="description">Windows Security, Sysmon, or JSON events are collected, normalized and redacted, stored in SQLite, evaluated by JSON detection rules, correlated into analyst-managed incidents, and exported as reports.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c31"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .heading{font:700 30px 'Segoe UI',Arial,sans-serif;fill:#f8fafc}
      .subheading{font:400 15px 'Segoe UI',Arial,sans-serif;fill:#94a3b8}
      .step{font:700 12px 'Segoe UI',Arial,sans-serif;letter-spacing:1.4px;fill:#7dd3fc}
      .card-title{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#f1f5f9}
      .body{font:400 14px 'Segoe UI',Arial,sans-serif;fill:#cbd5e1}
      .small{font:400 12px 'Segoe UI',Arial,sans-serif;fill:#94a3b8}
      .card{fill:#172338;stroke:#334155;stroke-width:1.4}
      .line{fill:none;stroke:#64748b;stroke-width:2.2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="690" rx="24" fill="url(#background)"/>
  <rect x="34" y="34" width="6" height="58" rx="3" fill="url(#accent)"/>
  <text x="60" y="61" class="heading">BlueSentinel · event to investigation</text>
  <text x="60" y="88" class="subheading">A local, defensive pipeline for Windows endpoint telemetry</text>

  <!-- top row -->
  <rect x="54" y="145" width="244" height="174" rx="16" class="card"/>
  <text x="76" y="177" class="step">01 · INPUT</text>
  <text x="76" y="209" class="card-title">Event sources</text>
  <text x="76" y="239" class="body">Windows Security log</text>
  <text x="76" y="263" class="body">Optional Sysmon log</text>
  <text x="76" y="287" class="body">JSON sample or import</text>

  <path d="M302 232 H342" class="line"/>
  <rect x="350" y="145" width="244" height="174" rx="16" class="card"/>
  <text x="372" y="177" class="step">02 · PREPARE</text>
  <text x="372" y="209" class="card-title">Normalize &amp; redact</text>
  <text x="372" y="239" class="body">Common event fields</text>
  <text x="372" y="263" class="body">Timezone-aware UTC</text>
  <text x="372" y="287" class="body">Secret-shaped values masked</text>

  <path d="M598 232 H638" class="line"/>
  <rect x="646" y="145" width="244" height="174" rx="16" class="card"/>
  <text x="668" y="177" class="step">03 · STORE</text>
  <text x="668" y="209" class="card-title">SQLite database</text>
  <text x="668" y="239" class="body">Events + collection runs</text>
  <text x="668" y="263" class="body">Detections + incidents</text>
  <text x="668" y="287" class="body">Duplicate event suppression</text>

  <path d="M894 232 H934" class="line"/>
  <rect x="942" y="145" width="204" height="174" rx="16" class="card"/>
  <text x="964" y="177" class="step">04 · DETECT</text>
  <text x="964" y="209" class="card-title">Rule engine</text>
  <text x="964" y="239" class="body">10 editable JSON rules</text>
  <text x="964" y="263" class="body">Thresholds + time windows</text>
  <text x="964" y="287" class="body">Evidence + ATT&amp;CK</text>

  <!-- transition to second row -->
  <path d="M1044 321 V386 H890" class="line"/>
  <rect x="646" y="405" width="244" height="174" rx="16" class="card"/>
  <text x="668" y="437" class="step">05 · CONNECT</text>
  <text x="668" y="469" class="card-title">Correlation</text>
  <text x="668" y="499" class="body">Ordered event chains</text>
  <text x="668" y="523" class="body">Shared account / host / IP</text>
  <text x="668" y="547" class="body">Related signals grouped</text>

  <path d="M638 492 H598" class="line"/>
  <rect x="350" y="405" width="244" height="174" rx="16" class="card"/>
  <text x="372" y="437" class="step">06 · INVESTIGATE</text>
  <text x="372" y="469" class="card-title">Analyst-owned cases</text>
  <text x="372" y="499" class="body">Evidence and notes</text>
  <text x="372" y="523" class="body">NEW → INVESTIGATING</text>
  <text x="372" y="547" class="body">RESOLVED / FALSE_POSITIVE</text>

  <path d="M342 492 H302" class="line"/>
  <rect x="54" y="405" width="244" height="174" rx="16" class="card"/>
  <text x="76" y="437" class="step">07 · SHARE</text>
  <text x="76" y="469" class="card-title">Investigation reports</text>
  <text x="76" y="499" class="body">JSON · CSV · Markdown</text>
  <text x="76" y="523" class="body">Events, evidence, incidents</text>
  <text x="76" y="547" class="body">Local files for review</text>

  <rect x="942" y="405" width="204" height="174" rx="16" fill="#102b2a" stroke="#2dd4bf" stroke-width="1.4"/>
  <text x="964" y="437" class="step" style="fill:#5eead4">SAFETY</text>
  <text x="964" y="469" class="card-title">Read-only collection</text>
  <text x="964" y="499" class="body">No automatic response</text>
  <text x="964" y="523" class="body">Signals need human review</text>
  <text x="964" y="547" class="body">Heuristics can be noisy</text>

  <text x="54" y="637" class="small">Collection → analysis → human investigation. The tool never disables accounts or changes endpoint settings.</text>
</svg>
